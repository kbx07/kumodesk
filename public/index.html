<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>KumoDesk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141b2d'/%3E%3Cpath d='M4 22c5-9 9 2 13-6s6-6 11-8' fill='none' stroke='%233987e5' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M4 26c6-5 10 1 14-3s6-3 10-5' fill='none' stroke='%23d95926' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth" class="auth" hidden></div>
<header class="top">
  <a class="brand" href="#/">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M3 21c5-9 9 2 13-6s7-6 13-8" fill="none" stroke="var(--line-tenkan)" stroke-width="3" stroke-linecap="round"/><path d="M3 27c6-5 10 1 14-3s7-3 12-5" fill="none" stroke="var(--line-kijun)" stroke-width="3" stroke-linecap="round"/></svg>
    <span>KumoDesk</span>
  </a>
  <nav id="nav"></nav>
  <div class="top-right">
    <span id="jobinfo" class="muted small"></span>
    <button id="refresh" class="btn primary"></button>
    <div class="bellwrap"><button id="bell" class="bell" aria-haspopup="true"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.3 16a1 1 0 0 0 .9 1.5h13.6a1 1 0 0 0 .9-1.5L18 12.6V9a6 6 0 0 0-6-6zm-2.2 16a2.3 2.3 0 0 0 4.4 0z" fill="currentColor"/></svg><span id="bellcount" class="bellcount" hidden></span></button><div id="bellpanel" class="bellpanel" hidden></div></div>
    <a id="mailbtn" class="bell" href="#/messages"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5zm2.2.5 6.8 5.2L18.8 7zM5 8.9V17h14V8.9l-7 5.3z" fill="currentColor"/></svg><span id="mailcount" class="bellcount" hidden></span></a>
    <div id="mode" class="modesw" role="group"></div>
    <select id="lang" class="lang" aria-label="Language">
      <option value="auto">Auto</option><option value="pl">Polski</option><option value="de">Deutsch</option><option value="en">English</option>
    </select>
    <div class="bellwrap"><button id="userbtn" class="userbtn" aria-haspopup="true"></button><div id="usermenu" class="usermenu" hidden></div></div>
  </div>
</header>
<main id="view"></main>
<footer class="foot"><span id="disclaimer"></span></footer>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
